# Sends each request to the next Tomcat node in turn. There are no sticky sessions.
events {}

http {
  upstream nodes {
    server node1:8080;
    server node2:8080;
  }

  server {
    listen 8080;
    # Larger than the app's 5 MB maxFileSize, so Struts' limit is the one you hit.
    client_max_body_size 25m;

    location / {
      proxy_pass http://nodes;
      proxy_set_header Host $http_host;
    }
  }
}
