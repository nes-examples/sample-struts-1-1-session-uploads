# Two Tomcat nodes that keep HTTP sessions in Redis, behind a proxy that sends each request to the
# next node in turn.
#
#   docker compose up --build -d                     Apache Struts 1.1
#   STRUTS=nes-trial docker compose up --build -d    the NES for Apache Struts 1.1 trial
#
# Then open http://localhost:8080/. The nodes are also on ports 8081 and 8082 for
# scripts/check.sh. Override the proxy's port with PORT=9090.
x-node: &node
  build:
    context: .
    args:
      STRUTS: ${STRUTS:-apache}
  image: sample-struts-1-1-session-uploads:${STRUTS:-apache}
  depends_on: [redis]

services:
  redis:
    image: redis:7-alpine

  node1:
    <<: *node
    environment:
      NODE_NAME: node1
    ports: ["8081:8080"]

  node2:
    <<: *node
    environment:
      NODE_NAME: node2
    ports: ["8082:8080"]

  proxy:
    image: nginx:1.27-alpine
    volumes: ["./docker/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["${PORT:-8080}:8080"]
    depends_on: [node1, node2]
